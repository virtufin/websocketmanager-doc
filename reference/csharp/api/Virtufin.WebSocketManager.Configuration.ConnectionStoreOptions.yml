  summary: >-
    Tuning for connection record state-store TTL. The WSM sets a Dapr

    <code>ttlInSeconds</code> on every connection record write, and refreshes it

    on every successful send. Records whose TTL elapses without traffic

    are removed by the state store without explicit reclaimer intervention.
