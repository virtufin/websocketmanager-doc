    startLine: 16
  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Configuration
  summary: >-
    Tuning for the optional owner-replica forwarding path. When

    <xref href="Virtufin.WebSocketManager.Configuration.OwnershipForwardOptions.MissesPerMinuteThreshold" data-throw-if-not-resolved="false"></xref> is 0 (default), the WSM never

    forwards cross-instance RPCs and the caller receives

    <code>StatusCode.FailedPrecondition</code> on every miss. Set the threshold

    to a non-zero value to enable forwarding only after the running

    5-minute miss rate exceeds it.
  remarks: >-
    The forward uses Dapr service invocation

    (<code>DaprClient.InvokeMethodAsync</code>) against the owning replica's

    app id (<code>websocketmanager</code>) so callers do not need cluster

    topology knowledge.
  example: []
  syntax:
