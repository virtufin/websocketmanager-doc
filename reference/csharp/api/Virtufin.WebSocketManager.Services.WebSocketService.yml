  fullName: Virtufin.WebSocketManager.Services.WebSocketService.ReclaimAsync(string, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: src/Virtufin.WebSocketManager/Services/WebSocketService.cs
      branch: master
      repo: https://git.haenerconsulting.com/virtufin/virtufin-websocketmanager
    id: ReclaimAsync
    path: ../../../src/Virtufin.WebSocketManager/Services/WebSocketService.cs
    startLine: 103
  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Takes ownership of a connection last known to be owned by another,

    now-unreachable instance. Unlike a fresh <xref href="Virtufin.WebSocketManager.Services.IWebSocketService.ConnectAsync(System.String%2cSystem.Boolean%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>,

    the connection ID and its persisted metadata (URL, auto-reconnect,

    topic, tags) are preserved. If auto-reconnect is set, attempts to

    open a fresh socket for it immediately -- the old owner's socket

    object lives in that process's memory, unreachable from here, so

    this instance genuinely has no live connection until one is

    (re)established. Returns <code>false</code> if no persisted record exists

    for <code class="paramref">id</code>.
  example: []
  syntax:
    content: public Task<bool> ReclaimAsync(string id, CancellationToken cancellationToken = default)
    parameters:
    - id: id
      type: System.String
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{System.Boolean}
    content.vb: Public Function ReclaimAsync(id As String, cancellationToken As CancellationToken = Nothing) As Task(Of Boolean)
  overload: Virtufin.WebSocketManager.Services.WebSocketService.ReclaimAsync*
