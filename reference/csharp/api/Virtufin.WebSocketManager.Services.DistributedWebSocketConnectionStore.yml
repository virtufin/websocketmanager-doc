  fullName: Virtufin.WebSocketManager.Services.DistributedWebSocketConnectionStore.ReclaimAsync(string, System.Threading.CancellationToken)
  type: Method
  source:
    remote:
      path: src/Virtufin.WebSocketManager/Services/DistributedWebSocketConnectionStore.cs
      branch: master
      repo: https://git.haenerconsulting.com/virtufin/virtufin-websocketmanager
    id: ReclaimAsync
    path: ../../../src/Virtufin.WebSocketManager/Services/DistributedWebSocketConnectionStore.cs
    startLine: 184
  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Re-stamps ownership of a connection last known to be owned by

    another (now unreachable) instance to this one, persists it, and

    registers it in this instance's local, in-memory view -- unlike

    <xref href="Virtufin.WebSocketManager.Services.IWebSocketConnectionStore.GetConnectionAsync(System.String%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>, which is local-only and would

    otherwise never see a connection this instance didn't originally

    create. Returns the reclaimed connection (caller is responsible for

    actually re-establishing the socket if desired), or <code>null</code> if

    no persisted record exists for <code class="paramref">id</code>.
  example: []
  syntax:
    content: public Task<WebSocketConnection?> ReclaimAsync(string id, CancellationToken cancellationToken = default)
    parameters:
    - id: id
      type: System.String
    - id: cancellationToken
      type: System.Threading.CancellationToken
