  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Total <code>RpcException</code> raised with <code>StatusCode.FailedPrecondition</code>

    from any RPC method. Tagged by method name. Increments unconditionally

    — even when the ownership-forward path catches the exception.
  example: []
  syntax:
    content: public static readonly Counter<long> DisconnectFailedPreconditionTotal
    return:
      type: System.Diagnostics.Metrics.Counter{System.Int64}
    content.vb: Public Shared ReadOnly DisconnectFailedPreconditionTotal As Counter(Of Long)
