      path: src/Virtufin.WebSocketManager/Services/AppMetrics.cs
      branch: master
      repo: https://gitea.haenerconsulting.com/virtufin/virtufin-websocketmanager
    id: DisconnectOwnershipMissTotal
    path: ../../../src/Virtufin.WebSocketManager/Services/AppMetrics.cs
    startLine: 42
  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Total cross-instance ownership misses. Tagged by reason

    (<code>not_owned</code> when the local replica is not the owner,

    <code>lapsed</code> when the owner has dropped from <code>knownInstances</code>

    past <code>INSTANCE_STALE_THRESHOLD_SECONDS</code>). Paired with

    <code>DisconnectForwardedTotal</code> to measure how many misses were

    successfully forwarded to the owner replica.
  example: []
  syntax:
    content: public static readonly Counter<long> DisconnectOwnershipMissTotal
    return:
      type: System.Diagnostics.Metrics.Counter{System.Int64}
    content.vb: Public Shared ReadOnly DisconnectOwnershipMissTotal As Counter(Of Long)
