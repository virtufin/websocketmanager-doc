  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Configuration
  summary: Configuration for the native-gRPC owner-replica forward path.
  remarks: >-
    Each WSM replica must advertise a routable gRPC endpoint so peer

    replicas can dial it directly. In a Kubernetes cluster, set

    <code>WSM_GRPC_HOST</code> to the pod IP (or service DNS name) and

    <code>WSM_GRPC_PORT</code> to the gRPC service port. In deploy-local

    (where everything is on localhost), the defaults are

    <code>localhost</code> + the gRPC port chosen at startup.
