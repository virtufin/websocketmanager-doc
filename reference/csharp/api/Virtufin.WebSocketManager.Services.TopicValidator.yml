  summary: >-
    Validates Dapr pubsub topic names against the patterns in the

    <a href="https://git.haenerconsulting.com/virtufin/virtufin-openspec/src/branch/master/openspec/specs/pubsub-topics/spec.md#requirement-topic-patterns">Pub/Sub Topics spec §Topic Patterns</a>.


    The WebSocketManager publishes per-frame user data to caller-supplied

    topics (the topic passed to <code>StartPublishRequest.topic</code>). Per

    <a href="https://git.haenerconsulting.com/virtufin/virtufin-openspec/src/branch/master/openspec/specs/cross-cutting/spec.md">Cross-cutting spec</a>,

    services that publish directly to Dapr MUST validate the topic

    name inline against these patterns. This class is the chokepoint

    that enforces the rule.


    Accepted patterns:
      1. <code>&lt;service&gt;.&lt;category&gt;</code>            — Tier 0 / infrastructure
         e.g. <code>websocketmanager.lifecycle</code>, <code>workmanager.infra.worker</code>
      2. <code>act.&lt;universe&gt;.exchange.&lt;venue&gt;.&lt;entity&gt;.&lt;event&gt;[.&lt;id&gt;]</code>
         — market data (real), universe symmetric with hyp (e.g. <code>ALL</code> for unrestricted)
      3. <code>hyp.&lt;universe&gt;.exchange.&lt;venue&gt;.&lt;entity&gt;.&lt;event&gt;[.&lt;id&gt;]</code>
         — market data (hypothetical), with universe
      4. <code>sc.&lt;scenarioId&gt;.&lt;domain&gt;.&lt;entity&gt;.&lt;event&gt;[.&lt;id&gt;]</code>
         — scenario-scoped events
      5. <code>command.&lt;service&gt;</code>            — command topics (worker input)
      6. <code>response.&lt;service&gt;</code>            — response topics (worker output)

    Rejected (intentionally):
      - <code>act.exchange.*</code>                  — act topics MUST carry a universe (use <code>act.ALL.exchange.*</code>)
      - <code>hyp.exchange.*</code>                  — hyp topics MUST carry a universe
