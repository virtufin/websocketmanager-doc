  summary: >-
    Validates a deserialized <xref href="Virtufin.WebSocketManager.Services.DaprStateStoreEntry" data-throw-if-not-resolved="false"></xref>: throws

    <xref href="System.InvalidOperationException" data-throw-if-not-resolved="false"></xref> if the persisted JSON is missing

    the required <code>InstanceId</code> field. This funnels data-integrity errors

    to the deserialization boundary, where the connection ID is still

    identifiable, instead of letting null-carrying entries reach business

    logic that wraps every usage with a guard.
  remarks: >-
    Reads the JSON manually rather than delegating to

    <code>JsonSerializer.Deserialize&lt;T&gt;(ref Utf8JsonReader, JsonSerializerOptions)</code>:

    that call would re-invoke this same converter and stack-overflow.
