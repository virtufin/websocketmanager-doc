  namespace: Virtufin.WebSocketManager.Configuration
  summary: >-
    Tuning for the instance heartbeat / discovery mechanism. The

    <code>InstanceHeartbeatService</code> publishes the local instance ID to

    the Dapr state store on an interval, and the connection reclaimer

    reads it to populate its <code>knownInstances</code> set so live pods

    don't have their connections reclaimed.
