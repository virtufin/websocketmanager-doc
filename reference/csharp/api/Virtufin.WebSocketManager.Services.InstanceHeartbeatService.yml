  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Background service that publishes a heartbeat for this instance

    to the Dapr state store on a configured interval and discovers

    peer instance heartbeats to populate the local <code>knownInstances</code>

    set.


    Without this, <xref href="Virtufin.WebSocketManager.Services.ConnectionReclaimerHostedService" data-throw-if-not-resolved="false"></xref> treats

    every connection from a different instance ID as a candidate for

    reclamation — which is correct only after the peer has died.

    Heartbeats let live peers advertise their presence so live

    connections are never reclaimed.
  example: []
  syntax:
    content: 'public sealed class InstanceHeartbeatService : BackgroundService, IHostedService, IDisposable'
    content.vb: Public NotInheritable Class InstanceHeartbeatService Inherits BackgroundService Implements IHostedService, IDisposable
