  assemblies:
  - Virtufin.WebSocketManager
  namespace: Virtufin.WebSocketManager.Services
  summary: >-
    Receiver-side endpoint for Dapr gRPC service invocation. When a

    peer WSM replica issues

    <code>DaprClient.InvokeMethodGrpcAsync&lt;…, …&gt;(SelfAppId, fullMethodName, …)</code>,

    the Dapr sidecar routes the call here as

    <code>AppCallback.OnInvoke(InvokeRequest, ServerCallContext)</code>. We

    dispatch by <code>request.Method</code> into the same handler chain used

    by the gRPC overrides on <xref href="Virtufin.WebSocketManager.Protos.WebSocketManagerService" data-throw-if-not-resolved="false"></xref>, so

    forwarded calls share semantics with direct gRPC calls.
  example: []
  syntax:
